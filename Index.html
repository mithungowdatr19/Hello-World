<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML WORLD</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            margin: 23px;
            padding: 23px;
            border: 2px solid black;
            border-radius: 40px;
            background-color: rgb(88, 86, 84);
            color: white;
            
        }
        .hw{
            text-align: center;
            font-size: 50px;
            font-weight: bolder;
            text-shadow: 10px 10px 30px;
            font-style:italic;
            border-radius: 30px;
            box-shadow: 0px 0px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="hw">
            Hello World !
        </nav>
    </div>
</body>
</html>
